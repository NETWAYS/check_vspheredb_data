object CheckCommand "vspheredb_data" {
    command = [ PluginContribDir + "/check_vspheredb_data" ]

    arguments = {
        "-f" = {
            description = "Path to the credentials file"
            value = "$vspheredb_data_credfile$"
        }
        "-d" = {
            description = "Database name (defaults to vspheredb)"
            value = "$vspheredb_data_dbname$"
        }
        "-H" = {
            description = "Database host to connect to"
            value = "$vspheredb_data_dbhost$"
        }
        "-m" = {
            description = "Machine to be queried for"
            value = "$host.name$"
        }
        "-P" = {
            description = "Database password (defaults to vspheredb)"
            value = "$vspheredb_data_dbpass$"
        }
        "-p" = {
            description = "Database port to connecto to (defaults to 3306)"
            value = "$vspheredb_data_dbport$"
        }
        "-u" = {
            description = "Database username (defaults to vspheredb)"
            value = "$vspheredb_data_username$"
        }
    }
}

object CheckCommand "vspheredb_data_cpu" {
    import "vspheredb_data"
    arguments += {
        "mode" = {
            description = "Checks CPU usage"
            value = "cpu"
            skip_key = true
            order = -1
        }
        "-c" = {
            description = "Critical threshold in percent as Integer (defaults to 90)"
            value = "$vspheredb_data_cpucrit$"
        }
        "-w" = {
            description = "Warning threshold in percent as Integer (defaults to 80)"
            value = "$vspheredb_data_cpuwarn$"
        }
    }
}

object CheckCommand "vspheredb_data_datastore" {
    import "vspheredb_data"
    arguments += {
        "mode" = {
            description = "Checks all datastores or a singular, specified datastore"
            value = "datastore"
            skip_key = true
            order = -1
        }
        "-c" = {
            description = "Critical threshold in percent as Integer (defaults to 90)"
            value = "$vspheredb_data_datastorecrit$"
        }
        "-w" = {
            description = "Warning threshold in percent as Integer (defaults to 80)"
            value = "$vspheredb_data_datastorewarn$"
        }
        "--datastore" = {
            description = "Datastore to check"
            value = "$vspheredb_data_datastore$"
        }
    }
}

